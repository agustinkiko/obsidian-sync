apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obsidian-auth

resources:
  - k8s/namespace.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/ingress.yaml

# No secrets here. The Google client ID and secret are entered in the Obsidian plugin settings.
configMapGenerator:
  - name: obsidian-auth-code
    files:
      - server.js
