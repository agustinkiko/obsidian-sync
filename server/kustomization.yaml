apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: obsidian-auth

resources:
  - k8s/namespace.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
  - k8s/ingress.yaml

configMapGenerator:
  - name: obsidian-auth-code
    files:
      - server.js
  - name: obsidian-auth-config
    literals:
      - PUBLIC_URL=https://obsidian-sync.jericogustin.com

# Create secret.env next to this file (it is gitignored):
#   CLIENT_ID=...apps.googleusercontent.com
#   CLIENT_SECRET=...
secretGenerator:
  - name: obsidian-auth-google
    envs:
      - secret.env
