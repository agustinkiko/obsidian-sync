apiVersion: apps/v1
kind: Deployment
metadata:
  name: obsidian-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obsidian-auth
  template:
    metadata:
      labels:
        app: obsidian-auth
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: server
          image: node:22-alpine
          command: ["node", "/app/server.js"]
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: obsidian-auth-config
            - secretRef:
                name: obsidian-auth-google
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: code
          configMap:
            name: obsidian-auth-code
