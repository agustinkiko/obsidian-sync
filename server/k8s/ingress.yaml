# Standard Ingress, so it works on any cluster with an ingress controller.
# Replace `relay.example.com` with your own hostname in an overlay (see README).
# ingressClassName is Traefik, the k3s default. Change it for other controllers.
# TLS is not set here: terminate HTTPS at your edge (a CDN/tunnel or cert-manager). Google requires HTTPS.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsidian-auth
spec:
  ingressClassName: traefik
  rules:
    - host: relay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: obsidian-auth
                port:
                  number: 80
