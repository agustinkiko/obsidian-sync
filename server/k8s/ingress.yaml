apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: obsidian-auth
  annotations:
    # Uses cert-manager for HTTPS. Google requires HTTPS for the callback.
    # Change the issuer name if yours is different.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - obsidian-sync.jericogustin.com
      secretName: obsidian-auth-tls
  rules:
    - host: obsidian-sync.jericogustin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: obsidian-auth
                port:
                  number: 80
